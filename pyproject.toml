[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wize-wizard"
version = "0.7.7"
description = "Strategy learning, decision-analysis, and execution workbench"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "textual>=0.70",
  "rich>=13.7",
  "Flask>=3.0",
  "waitress>=3.0"
]

[project.optional-dependencies]
animation = ["manim>=0.19"]
dev = [
  "pytest>=8.0",
  "build>=1.2"
]

[project.scripts]
wize-wizard = "wize_wizard.app:main"
wize-wizard-web = "wize_wizard.web:main"

[tool.hatch.build.targets.wheel]
packages = ["wize_wizard"]
