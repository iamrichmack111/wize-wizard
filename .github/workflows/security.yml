name: Security Hardening

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  bandit:
    name: Bandit / Python security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade bandit[toml]
      - name: Scan application code
        run: bandit -r wize_wizard -x tests -ll

  dependency-audit:
    name: pip-audit / dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project and audit tool
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip install -e .
      - name: Audit installed dependencies
        run: pip-audit --strict

  trivy:
    name: Trivy / filesystem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Vulnerability and secret scan
        uses: aquasecurity/trivy-action@0.32.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
