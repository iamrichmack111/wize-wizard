name: Deploy RichmackOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wizard-production
  cancel-in-progress: false

jobs:
  verify:
    name: Pre-deploy verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m compileall -q wize_wizard animations scripts
          pytest -q
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: wize-wizard:deploy-check

  deploy:
    name: Deploy / wizard.richmackos.com
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_KEY: ${{ secrets.RICHMACKOS_SSH_KEY }}
      DEPLOY_HOST: ${{ secrets.RICHMACKOS_HOST }}
      DEPLOY_USER: ${{ secrets.RICHMACKOS_USER }}
    steps:
      - uses: actions/checkout@v5

      - name: Check deployment secrets
        id: secrets
        shell: bash
        run: |
          if [[ -n "$DEPLOY_KEY" && -n "$DEPLOY_HOST" && -n "$DEPLOY_USER" ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'RichmackOS deploy secrets are not configured; deployment is skipped.'
          fi

      - name: Install SSH key
        if: steps.secrets.outputs.enabled == 'true'
        shell: bash
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/richmackos_deploy
          chmod 600 ~/.ssh/richmackos_deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Sync application code
        if: steps.secrets.outputs.enabled == 'true'
        shell: bash
        run: |
          rsync -az --delete \
            -e "ssh -T -o IdentitiesOnly=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=6 -i ~/.ssh/richmackos_deploy" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.env' \
            --exclude 'data/' \
            --exclude 'backups/' \
            --exclude '.venv/' \
            --exclude '__pycache__/' \
            --exclude '.pytest_cache/' \
            --exclude '*.db' \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:/home/ubuntu/wizard/"

      - name: Deploy with transport-failure recovery
        if: steps.secrets.outputs.enabled == 'true'
        shell: bash
        run: |
          set -u
          SSH=(ssh -T -o IdentitiesOnly=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=6 -o ConnectTimeout=12 -i ~/.ssh/richmackos_deploy "${DEPLOY_USER}@${DEPLOY_HOST}")
          rc=0
          "${SSH[@]}" 'if command -v richdeploy >/dev/null 2>&1 && richdeploy wizard; then exit 0; fi; cd /home/ubuntu/wizard && docker compose -f docker-compose.prod.yml up -d --build --remove-orphans' || rc=$?
          if [[ "$rc" -ne 0 ]]; then
            echo "SSH/richdeploy returned $rc; verifying real backend state before failing."
            sleep 4
            if "${SSH[@]}" 'curl -fsS --max-time 5 http://127.0.0.1:5080/healthz >/dev/null'; then
              echo 'Backend is healthy; treating SSH transport failure as recovered.'
              exit 0
            fi
            "${SSH[@]}" 'cd /home/ubuntu/wizard && docker compose -f docker-compose.prod.yml ps && docker compose -f docker-compose.prod.yml logs --tail=120' || true
            exit "$rc"
          fi

      - name: Verify backend and public HTTPS
        if: steps.secrets.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail

          SSH=(ssh -T -o IdentitiesOnly=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=6 -i ~/.ssh/richmackos_deploy "${DEPLOY_USER}@${DEPLOY_HOST}")

          echo "Checking production backend..."
          "${SSH[@]}" 'curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors --connect-timeout 5 --max-time 15 http://127.0.0.1:5080/healthz'

          echo "Checking public HTTPS..."
          curl --fail --silent --show-error             --retry 10             --retry-delay 3             --retry-all-errors             --connect-timeout 10             --max-time 30             https://wizard.richmackos.com/healthz

          echo "Wize Wizard production health checks passed."
