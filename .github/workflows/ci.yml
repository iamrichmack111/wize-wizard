name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Reject unresolved merge conflicts
        shell: bash
        run: |
          if grep -RIn \
            --exclude-dir=.git \
            --exclude-dir=.venv \
            --exclude-dir=venv \
            -E '^(<<<<<<<|=======|>>>>>>>)' .; then
            echo "::error::Unresolved Git merge-conflict markers found."
            exit 1
          fi

      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Compile Python
        run: python -m compileall -q wize_wizard

      - name: Run tests
        run: python -m pytest -q

      - name: Docker build
        run: docker build -t wize-wizard-ci .
