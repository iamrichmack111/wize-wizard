<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="{{ url_for('static',filename='css/app.css') }}"><title>Login · Wize Wizard</title></head><body class="login-bg"><form class="login-card" method="post"><div class="brand-mark login-mark" aria-hidden="true"><i></i><i></i><i></i></div><h1>Wize Wizard</h1><p>Strategy • Mathematics • Execution • Learning</p>{% with msgs=get_flashed_messages(with_categories=true) %}{% for cat,msg in msgs %}<div class="flash {{cat}}">{{msg}}</div>{% endfor %}{% endwith %}<input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Username<input name="username" autocomplete="username" required autofocus></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="primary full">Sign in</button><div class="hint">Sign in with your Wize Wizard account.</div></form></body></html>
